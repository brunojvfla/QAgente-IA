services:
  postgres:
    image: postgres:17-alpine
    container_name: qagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qagent
      POSTGRES_USER: qagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qagent_local_password}
    ports:
      - "5432:5432"
    volumes:
      - qagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qagent -d qagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qagent-postgres-data:
